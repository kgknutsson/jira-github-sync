# Runs this repository's own action (uses: ./) with the sample rules, so pull requests and
# releases exercise the committed dist/index.mjs on GitHub's runner. Other repositories copy
# templates/jira-sync.workflow.yml instead. Without Jira secrets the action validates and skips.
name: Jira Sync

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited, converted_to_draft, closed]
    branches: [dev, test, main]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ['Quality Gate', 'Deploy']
    types: [completed]
  release:
    types: [published]

concurrency:
  group: >-
    ${{ (github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number)
    && format('jira-sync-pr-{0}', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number)
    || format('jira-sync-{0}-{1}', github.event_name, github.event.workflow_run.id || github.event.release.id || github.sha) }}
  queue: max

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  jira-sync:
    name: Jira Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name != 'pull_request_review' ||
        contains(fromJSON('["dev", "test", "main"]'), github.event.pull_request.base.ref)) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.repository.id == github.repository_id &&
          github.event.workflow_run.head_repository.id == github.repository_id))
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          config-file: templates/jira-sync.config.yml
          jira-base-url: ${{ secrets.JIRA_BASE_URL }}
          jira-user-email: ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
