# Copy to .github/workflows/jira-sync.yml in your repository, next to the rules file
# .github/jira-sync.config.yml (start from templates/jira-sync.config.yml).
#
# Keep the triggers in sync with the rules: every action a rule matches must be listed under
# `types`, and every workflow name under workflow_run.workflows. The action warns in the job log
# when they drift.
#
# Secrets: JIRA_BASE_URL, JIRA_USER_EMAIL, JIRA_API_TOKEN, as repository, organization or
# environment secrets. For environment secrets, uncomment `environment:` on the job.
name: Jira Sync

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited, converted_to_draft, closed]
    branches: [dev, test, main]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ['Quality Gate', 'Deploy']
    types: [completed]
  release:
    types: [published]

# One queue per PR / workflow run / release. Never cancel an in-flight sync: a cancelled run can
# drop the transition for an earlier event (e.g. `opened`).
concurrency:
  group: jira-sync-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.release.id || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  jira-sync:
    name: Jira Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # environment:
    #   name: jira-sync
    #   deployment: false
    # Reviews have no branch filter, so match the pull_request branches here; skip workflow runs
    # that came from forks (they would run with your secrets).
    if: >-
      (github.event_name != 'pull_request_review' ||
        contains(fromJSON('["dev", "test", "main"]'), github.event.pull_request.base.ref)) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.repository.id == github.repository_id &&
          github.event.workflow_run.head_repository.id == github.repository_id))
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: kgknutsson/jira-github-sync@v1
        with:
          jira-base-url: ${{ secrets.JIRA_BASE_URL }}
          jira-user-email: ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
